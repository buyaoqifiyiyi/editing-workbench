[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openedit-engine"
version = "1.1.0"
description = "Pure open-source video editing and VFX engine (FilmCraft + EffectCraft + FFmpeg) with CLI and stdio MCP adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Pillow==12.3.0",
  "numpy==2.5.3",
  "imageio==2.38.0",
  "fonttools==4.60.2",
]

[project.optional-dependencies]
exchange = ["opentimelineio==0.18.1"]
rhythm = ["librosa==0.11.0", "numba==0.68.0", "scipy==1.18.1"]
audio = ["faster-whisper==1.2.1", "onnxruntime>=1.31.0", "av==19.0.1"]
vfx = ["moderngl==5.13.0", "opencolorio==2.6.0", "scipy==1.18.1"]
search = ["tokenizers==0.23.3", "huggingface-hub>=2.0.0"]
scene-deps = ["click>=8.0,<9.0", "platformdirs>=4.0", "tqdm>=4.60"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.31.0", "nvidia-cublas-cu12>=12.0"]
tracking = ["opencv-contrib-python-headless==4.13.0.92", "av==19.0.1"]
mcp = ["mcp==2.3.0"]
all = [
  "opentimelineio==0.18.1",
  "librosa==0.11.0",
  "numba==0.68.0",
  "scipy==1.18.1",
  "faster-whisper==1.2.1",
  "onnxruntime>=1.31.0",
  "av==19.0.1",
  "opencv-contrib-python-headless==4.13.0.92",
  "moderngl==5.13.0",
  "opencolorio==2.6.0",
  "tokenizers==0.23.3",
  "huggingface-hub>=2.0.0",
  "click>=8.0,<9.0",
  "platformdirs>=4.0",
  "tqdm>=4.60",
  "mcp==2.3.0",
]

[project.scripts]
openedit = "openedit_engine.cli:main"
openedit-mcp = "openedit_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openedit_engine*"]
namespaces = true

[tool.setuptools.package-data]
openedit_engine = [
  "runtime/scripts/*.py",
  "runtime/scripts/*.cjs",
  "runtime/scripts/*.txt",
  "runtime/references/*.md",
  "runtime/references/styles/*.md",
  "runtime/guides/*.md",
]
